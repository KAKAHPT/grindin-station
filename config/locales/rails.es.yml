# Spanish (es-ES) translations for Rails/framework and gem-provided keys (rails-i18n is not a dependency).
# The number.nth procs live in rails.es.rb because YAML cannot hold them.
es:
  date:
    formats:
      default: "%d/%m/%Y"
      short: "%d de %b"
      long: "%d de %B de %Y"
    day_names: [domingo, lunes, martes, miércoles, jueves, viernes, sábado]
    abbr_day_names: [dom, lun, mar, mié, jue, vie, sáb]
    month_names: [~, enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
    abbr_month_names: [~, ene, feb, mar, abr, may, jun, jul, ago, sep, oct, nov, dic]
    order: [day, month, year]
  time:
    formats:
      default: "%a, %d de %b de %Y, %H:%M:%S %z"
      short: "%d/%m, %H:%M"
      long: "%d de %B de %Y, %H:%M"
    am: "a. m."
    pm: "p. m."
  support:
    array:
      words_connector: ", "
      two_words_connector: " y "
      last_word_connector: " y "
  number:
    format:
      separator: ","
      delimiter: "."
      precision: 3
      round_mode: default
      significant: false
      strip_insignificant_zeros: false
    currency:
      format:
        format: "%n %u"
        negative_format: "-%n %u"
        unit: "€"
        separator: ","
        delimiter: "."
        precision: 2
        significant: false
        strip_insignificant_zeros: false
    percentage:
      format:
        delimiter: ""
        format: "%n%"
    precision:
      format:
        delimiter: ""
    human:
      format:
        delimiter: ""
        precision: 3
        significant: true
        strip_insignificant_zeros: true
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: Byte
            other: Bytes
          kb: KB
          mb: MB
          gb: GB
          tb: TB
          pb: PB
          eb: EB
          zb: ZB
      decimal_units:
        format: "%n %u"
        units:
          unit: ""
          thousand: mil
          million:
            one: millón
            other: millones
          billion: mil millones
          trillion:
            one: billón
            other: billones
          quadrillion: mil billones
  errors:
    format: "%{attribute} %{message}"
    messages:
      model_invalid: "La validación falló: %{errors}"
      inclusion: "no está incluido en la lista"
      exclusion: "está reservado"
      invalid: "no es válido"
      confirmation: "no coincide con %{attribute}"
      accepted: "debe ser aceptado"
      empty: "no puede estar vacío"
      blank: "no puede estar en blanco"
      present: "debe estar en blanco"
      too_long:
        one: "es demasiado largo (máximo: 1 carácter)"
        other: "es demasiado largo (máximo: %{count} caracteres)"
      password_too_long: "es demasiado larga"
      too_short:
        one: "es demasiado corto (mínimo: 1 carácter)"
        other: "es demasiado corto (mínimo: %{count} caracteres)"
      wrong_length:
        one: "no tiene la longitud correcta (debe tener 1 carácter)"
        other: "no tiene la longitud correcta (debe tener %{count} caracteres)"
      not_a_number: "no es un número"
      not_an_integer: "debe ser un número entero"
      greater_than: "debe ser mayor que %{count}"
      greater_than_or_equal_to: "debe ser mayor o igual que %{count}"
      equal_to: "debe ser igual a %{count}"
      less_than: "debe ser menor que %{count}"
      less_than_or_equal_to: "debe ser menor o igual que %{count}"
      other_than: "debe ser distinto de %{count}"
      in: "debe estar en %{count}"
      odd: "debe ser impar"
      even: "debe ser par"
      required: "debe existir"
      taken: "ya está en uso"
    unavailable_session: |
      La sesión %{id} ya no está disponible en memoria.

      Si usas un servidor con varios procesos (como Unicorn o Puma), el proceso
      que recibió esta petición no guarda %{id} en memoria. Considera reducir el número de
      procesos/workers a uno (1) o usar otro servidor en desarrollo.
    unacceptable_request: |
      Se espera una versión compatible en la cabecera Accept.
    connection_refused: |
      ¡Vaya! No se pudo conectar con el middleware Web Console.
      Comprueba que hay un servidor de desarrollo de Rails en marcha.
  activerecord:
    errors:
      messages:
        record_invalid: "La validación falló: %{errors}"
        restrict_dependent_destroy:
          has_one: "No se puede eliminar el registro porque existe un(a) %{record} dependiente"
          has_many: "No se puede eliminar el registro porque existen %{record} dependientes"
  datetime:
    distance_in_words:
      half_a_minute: "medio minuto"
      less_than_x_seconds:
        one: "menos de 1 segundo"
        other: "menos de %{count} segundos"
      x_seconds:
        one: "1 segundo"
        other: "%{count} segundos"
      less_than_x_minutes:
        one: "menos de un minuto"
        other: "menos de %{count} minutos"
      x_minutes:
        one: "1 minuto"
        other: "%{count} minutos"
      about_x_hours:
        one: "alrededor de 1 hora"
        other: "alrededor de %{count} horas"
      x_days:
        one: "1 día"
        other: "%{count} días"
      about_x_months:
        one: "alrededor de 1 mes"
        other: "alrededor de %{count} meses"
      x_months:
        one: "1 mes"
        other: "%{count} meses"
      about_x_years:
        one: "alrededor de 1 año"
        other: "alrededor de %{count} años"
      over_x_years:
        one: "más de 1 año"
        other: "más de %{count} años"
      almost_x_years:
        one: "casi 1 año"
        other: "casi %{count} años"
    prompts:
      year: Año
      month: Mes
      day: Día
      hour: Hora
      minute: Minuto
      second: Segundos
    relative:
      future: "dentro de %{time}"
      past: "hace %{time}"
  helpers:
    select:
      prompt: "Selecciona una opción"
    submit:
      create: "Crear %{model}"
      update: "Actualizar %{model}"
      submit: "Guardar %{model}"
    page_entries_info:
      entry:
        zero: "registros"
        one: "registro"
        other: "registros"
      one_page:
        display_entries:
          zero: "Ningún %{entry_name} encontrado"
          one: "Mostrando <b>1</b> %{entry_name}"
          other: "Mostrando <b>los %{count}</b> %{entry_name}"
      more_pages:
        display_entries: "Mostrando %{entry_name} <b>%{first}&nbsp;-&nbsp;%{last}</b> de <b>%{total}</b> en total"
  views:
    pagination:
      first: "&laquo; Primera"
      last: "Última &raquo;"
      truncate: "&hellip;"
