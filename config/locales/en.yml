      points:
        note_html: "<b class=\"font-semibold text-ink\">Ranking points.</b> Every finished tournament or league gives points for the games played in the Swiss rounds, bonuses for the top cut and the win, all multiplied by the size of the field. The ranking adds up a player's points over the events that match the filters."
        open: "How are ranking points calculated?"
        title: "How ranking points are calculated"
        short:
          - "Every game you play in the Swiss rounds puts points in your pocket: 3 for a win, 1 for a draw or a bye, nothing for a loss."
          - "Making the top cut adds a bonus, reaching the top 4 adds more and winning the tournament adds the biggest one."
          - "Bigger tournaments are worth more: the whole total is multiplied by the size of the field, so winning against 80 players is worth twice as much as winning against 16."
          - "Losing never takes points away. Your ranking is the sum of your events."
        d1: "Each finished event gives every player who took part"
        formula: "points = (3 × wins + draws + byes + bonuses) × field factor"
        d2_html: "Games count only in the <b>Swiss rounds</b> (and league pods); the cut rounds give the bonuses instead, in every format. A 1v1 match won counts as one win whatever the games, a bye counts like a draw and a penalty counts as a loss. Losses are worth 0 and never subtract."
        bonuses: "Bonuses"
        bonuses_html: "Made the top cut <b>+5</b>; reached the top 4 of the cut <b>+5 more</b>; won the tournament <b>+10 more</b>. Leagues have no cut, so no bonuses."
        factor: "Field factor"
        factor_lead: "From the number of players in the event (the waiting list does not count):"
        field: "Players"
        multiplier: "Factor"
        up_to: "%{count} or fewer"
        between: "%{from} to %{to}"
        more_than: "More than %{count}"
        example_lead: "Ana plays a 40-player tournament: 4 wins, 1 draw and 1 loss in the Swiss, then she wins the top cut."
        step: "Step"
        rows:
          swiss: "Swiss: 4 × 3 + 1"
          cut: "Made the top cut"
          top4: "Reached the top 4"
          won: "Won the tournament"
          subtotal: "Before the field factor"
          total: "Ana's points (40 players, × 1.5)"
        rules: "Only finished events count. A season is the calendar year of the event's start date. Country and team are the ones on the player's account. The standings are recomputed every night and whenever an event finishes or a result is corrected, so a fix in a past event is always reflected."
      elo:
        note_html: "<b class=\"font-semibold text-ink\">Leaderboard.</b> A rating that goes up when you beat players better than you and barely moves when you beat players far below you. Everyone starts at 1500."
        open: "How is the rating calculated?"
        title: "How the rating is calculated"
        short:
          - "Everyone starts with 1500 marbles."
          - "When you win a game, you take some marbles from the players you beat. When you lose, you give some away."
          - "Beat someone with <b>many more</b> marbles than you and you take <b>a lot</b>. Beat someone with far fewer and you take <b>only a few</b>. Lose to someone far below you and you give away a lot."
          - "A draw is a small trade: the player with more marbles gives a few to the one with fewer."
          - "In a pod of four you play against the other three at the same time, so one win collects marbles from all three."
        d1_html: "The leaderboard uses the <b>Elo rating system</b>, designed by Arpad Elo for chess and used by most competitive games since. Each player has a rating <code>R</code>. Before a game, the rating gap predicts the result: the <b>expected score</b> of player A against player B is"
        d2_html: "Equal ratings give an expected 0.5 (a coin flip). A 200-point edge gives about 0.76, a 400-point edge about 0.91. After the game, the actual score <code>S</code> is 1 for a win, 0.5 for a draw and 0 for a loss, and the rating moves by"
        d3_html: "with <code>K = 32</code>. The further the result is from what was expected, the bigger the move; a result exactly as expected moves nothing."
        pods: "Pods of four"
        pods_text: "A Commander pod is scored as six duels, one for every pair of players at the table. The winner scores 1 against each of the other three; those three score 0 against the winner and 0.5 against each other. A drawn table is six draws. Each duel updates both players with the formula above, so a win at a table full of 1700-rated players is worth far more than a win among 1400s. A player who drops or does not show up is skipped for that round. 1v1 events are a single duel per match."
        example_lead: "Ana (1500) wins a pod against Bruno (1600), Carla (1500) and Diogo (1400)."
        duel: "Duel"
        expected: "Expected"
        actual: "Actual"
        change: "Ana's change"
        versus: "Ana vs %{name} (%{rating})"
        after: "Ana after the pod"
        example_note: "Bruno, Carla and Diogo each lose their side of the duel with Ana and trade small amounts among themselves for the draws."
        rules: "Ratings are kept per game format (cEDH pods, Legacy, Modern, …): a Legacy result never moves a pod rating, and the Leaderboard always shows one format, cEDH pods unless you pick another. New players start at 1500 and are marked provisional until 10 rated games; only finished events count, and top cut rounds are not rated. A season rating counts that season's events and \"All time\" every event; the other filters only choose who is listed, they never change a rating. Ratings are recomputed from scratch whenever a result is corrected, so a fix in a past event is always reflected."
      teams:
        note_html: "<b class=\"font-semibold text-ink\">Teams.</b> A team is the group of friends a player names on their account, not a tournament entry. Team points come from what its players do: ranking points, top cuts and wins, counting the team's five best players."
        open: "How are team points calculated?"
        title: "How team points are calculated"
        short:
          - "A team is a group of friends who play together. The team does not play as a team: each friend plays their own tournaments."
          - "The team's score is what its friends bring home: every point a friend earns in the ranking goes into the team's jar, a top cut adds a bonus and a tournament win adds a bigger bonus."
          - "Only the five best friends of each team put points in the jar, so a huge team cannot win just by having many members."
        d1: "For the events that match the filters, each player's contribution is"
        formula: "contribution = ranking points + %{cut} × top cuts + %{win} × wins"
        d2_html: "The team score is the sum of the <b>five highest contributions</b> among its players (all of them when the team has five or fewer). The table also shows the plain totals (events, wins, top cuts) and the average Elo rating of the counted players, which does not enter the score."
        ranking_points: "Ranking points"
        contribution: "Contribution"
        total:
          one: "Team (1 player)"
          other: "Team (%{count} players)"
        rules: "A player counts for the team named on their account when the standings are recomputed (every night and after each event), so changing team moves all of their points to the new team. Teams with a single player are listed too. The bonuses (15 and 30) live in one place so they can change without touching the rest."

