    circuits_html: "Os circuitos dos organizadores têm a sua própria classificação: %{link}."
    circuits_link: "ver circuitos"
    how:
      short_title: "Em poucas palavras."
      detailed: "A versão detalhada"
      example: "Exemplo"
      rules: "Regras da casa"
      close: "Fechar"
      points:
        note_html: "<b class=\"font-semibold text-ink\">Pontos de ranking.</b> Cada torneio ou liga terminado dá pontos pelos jogos das rondas suíças e bónus pelo top cut e pela vitória, tudo multiplicado pelo tamanho do evento. O ranking soma os pontos de cada jogador nos eventos que correspondem aos filtros."
        open: "Como se calculam os pontos de ranking?"
        title: "Como se calculam os pontos de ranking"
        short:
          - "Cada jogo que jogas nas rondas suíças põe pontos no teu bolso: 3 por uma vitória, 1 por um empate ou um bye, nada por uma derrota."
          - "Entrar no top cut dá um bónus, chegar ao top 4 dá mais e ganhar o torneio dá o maior de todos."
          - "Torneios maiores valem mais: o total é multiplicado pelo tamanho do evento, por isso ganhar contra 80 jogadores vale o dobro de ganhar contra 16."
          - "Perder nunca te tira pontos. O teu ranking é a soma dos teus eventos."
        d1: "Cada evento terminado dá a cada jogador que participou"
        formula: "pontos = (3 × vitórias + empates + byes + bónus) × fator do evento"
        d2_html: "Os jogos só contam nas <b>rondas suíças</b> (e nas mesas de liga); as rondas do cut dão os bónus, em todos os formatos. Uma partida 1v1 ganha conta como uma vitória, seja qual for o resultado dos jogos; um bye conta como um empate e uma penalização conta como uma derrota. As derrotas valem 0 e nunca descontam."
        bonuses: "Bónus"
        bonuses_html: "Entrar no top cut <b>+5</b>; chegar ao top 4 do cut <b>mais +5</b>; ganhar o torneio <b>mais +10</b>. As ligas não têm cut, por isso não têm bónus."
        factor: "Fator do evento"
        factor_lead: "Pelo número de jogadores no evento (a lista de espera não conta):"
        field: "Jogadores"
        multiplier: "Fator"
        up_to: "%{count} ou menos"
        between: "%{from} a %{to}"
        more_than: "Mais de %{count}"
        example_lead: "A Ana joga um torneio de 40 jogadores: 4 vitórias, 1 empate e 1 derrota nas suíças, e depois ganha o top cut."
        step: "Passo"
        rows:
          swiss: "Suíças: 4 × 3 + 1"
          cut: "Entrou no top cut"
          top4: "Chegou ao top 4"
          won: "Ganhou o torneio"
          subtotal: "Antes do fator do evento"
          total: "Pontos da Ana (40 jogadores, × 1,5)"
        rules: "Só contam eventos terminados. Uma época é o ano civil da data de início do evento. O país e a equipa são os da conta do jogador. A classificação é recalculada todas as noites e sempre que um evento termina ou um resultado é corrigido, por isso uma correção num evento passado fica sempre refletida."
      elo:
        note_html: "<b class=\"font-semibold text-ink\">Classificação.</b> Um rating que sobe quando ganhas a jogadores melhores do que tu e quase não mexe quando ganhas a jogadores muito abaixo de ti. Todos começam com 1500."
        open: "Como se calcula o rating?"
        title: "Como se calcula o rating"
        short:
          - "Toda a gente começa com 1500 berlindes."
          - "Quando ganhas um jogo, ficas com alguns berlindes dos jogadores que venceste. Quando perdes, dás alguns."
          - "Se ganhares a alguém com <b>muitos mais</b> berlindes do que tu, ficas com <b>muitos</b>. Se ganhares a alguém com muito menos, ficas <b>só com alguns</b>. Se perderes com alguém muito abaixo de ti, dás muitos."
          - "Um empate é uma pequena troca: quem tem mais berlindes dá alguns a quem tem menos."
          - "Numa mesa de quatro jogas contra os outros três ao mesmo tempo, por isso uma vitória recolhe berlindes dos três."
        d1_html: "A classificação usa o <b>sistema de rating Elo</b>, criado por Arpad Elo para o xadrez e usado desde então pela maioria dos jogos competitivos. Cada jogador tem um rating <code>R</code>. Antes de um jogo, a diferença de rating prevê o resultado: a <b>pontuação esperada</b> do jogador A contra o jogador B é"
        d2_html: "Ratings iguais dão uma pontuação esperada de 0,5 (cara ou coroa). Uma vantagem de 200 pontos dá cerca de 0,76, uma de 400 pontos cerca de 0,91. Depois do jogo, a pontuação real <code>S</code> é 1 numa vitória, 0,5 num empate e 0 numa derrota, e o rating muda"
        d3_html: "com <code>K = 32</code>. Quanto mais o resultado se afasta do esperado, maior a mudança; um resultado exatamente como esperado não muda nada."
        pods: "Mesas de quatro"
        pods_text: "Uma mesa de Commander conta como seis duelos, um por cada par de jogadores na mesa. O vencedor marca 1 contra cada um dos outros três; esses três marcam 0 contra o vencedor e 0,5 entre si. Uma mesa empatada são seis empates. Cada duelo atualiza os dois jogadores com a fórmula acima, por isso uma vitória numa mesa cheia de jogadores com 1700 vale muito mais do que uma vitória entre jogadores com 1400. Um jogador que desiste ou não aparece fica de fora nessa ronda. Nos eventos 1v1 cada partida é um único duelo."
        example_lead: "A Ana (1500) ganha uma mesa contra o Bruno (1600), a Carla (1500) e o Diogo (1400)."
        duel: "Duelo"
        expected: "Esperado"
        actual: "Real"
        change: "Variação da Ana"
        versus: "Ana vs %{name} (%{rating})"
        after: "Ana depois da mesa"
        example_note: "O Bruno, a Carla e o Diogo perdem cada um o seu lado do duelo com a Ana e trocam pequenas quantias entre si pelos empates."
        rules: "Os ratings são separados por formato de jogo (mesas de cEDH, Legacy, Modern, …): um resultado de Legacy nunca mexe num rating de mesas, e a Classificação mostra sempre um só formato, as mesas de cEDH a menos que escolhas outro. Os novos jogadores começam com 1500 e ficam marcados como provisórios até 10 jogos com rating; só contam eventos terminados e as rondas do top cut não contam para o rating. O rating de uma época conta os eventos dessa época e \"Sempre\" conta todos; os outros filtros só escolhem quem aparece, nunca mudam um rating. Os ratings são recalculados de raiz sempre que um resultado é corrigido, por isso uma correção num evento passado fica sempre refletida."
      teams:
        note_html: "<b class=\"font-semibold text-ink\">Equipas.</b> Uma equipa é o grupo de amigos que um jogador indica na sua conta, não uma inscrição num torneio. Os pontos da equipa vêm do que os seus jogadores fazem: pontos de ranking, top cuts e vitórias, contando os cinco melhores jogadores da equipa."
        open: "Como se calculam os pontos das equipas?"
        title: "Como se calculam os pontos das equipas"
        short:
          - "Uma equipa é um grupo de amigos que jogam juntos. A equipa não joga como equipa: cada amigo joga os seus próprios torneios."
          - "A pontuação da equipa é o que os amigos trazem para casa: cada ponto que um amigo ganha no ranking vai para o frasco da equipa, um top cut junta um bónus e uma vitória num torneio junta um bónus maior."
          - "Só os cinco melhores amigos de cada equipa põem pontos no frasco, por isso uma equipa enorme não ganha só por ter muitos membros."
        d1: "Nos eventos que correspondem aos filtros, a contribuição de cada jogador é"
        formula: "contribuição = pontos de ranking + %{cut} × top cuts + %{win} × vitórias"
        d2_html: "A pontuação da equipa é a soma das <b>cinco maiores contribuições</b> entre os seus jogadores (todas, quando a equipa tem cinco ou menos). A tabela mostra também os totais simples (eventos, vitórias, top cuts) e o rating Elo médio dos jogadores contados, que não entra na pontuação."
        ranking_points: "Pontos de ranking"
        contribution: "Contribuição"
        total:
          one: "Equipa (1 jogador)"
          other: "Equipa (%{count} jogadores)"
        rules: "Um jogador conta para a equipa indicada na sua conta quando a classificação é recalculada (todas as noites e depois de cada evento), por isso, se mudares de equipa, todos os teus pontos passam para a nova equipa. As equipas com um só jogador também aparecem. Os bónus (15 e 30) estão num só sítio para poderem mudar sem mexer no resto."

