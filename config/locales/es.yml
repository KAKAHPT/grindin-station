      rules: "Reglas de la casa"
      close: "Cerrar"
      points:
        note_html: "<b class=\"font-semibold text-ink\">Puntos de ranking.</b> Cada torneo o liga terminado da puntos por las partidas de las rondas suizas y bonus por el top cut y la victoria, todo multiplicado por el tamaño del evento. El ranking suma los puntos de cada jugador en los eventos que coinciden con los filtros."
        open: "¿Cómo se calculan los puntos de ranking?"
        title: "Cómo se calculan los puntos de ranking"
        short:
          - "Cada partida que juegas en las rondas suizas te da puntos: 3 por una victoria, 1 por un empate o un bye, nada por una derrota."
          - "Entrar en el top cut da un bonus, llegar al top 4 da más y ganar el torneo da el mayor de todos."
          - "Los torneos más grandes valen más: el total se multiplica por el tamaño del evento, así que ganar contra 80 jugadores vale el doble que ganar contra 16."
          - "Perder nunca te quita puntos. Tu ranking es la suma de tus eventos."
        d1: "Cada evento terminado da a cada jugador que participó"
        formula: "puntos = (3 × victorias + empates + byes + bonus) × factor del evento"
        d2_html: "Las partidas solo cuentan en las <b>rondas suizas</b> (y en las mesas de liga); las rondas del cut dan los bonus, en todos los formatos. Una partida 1v1 ganada cuenta como una victoria, sea cual sea el resultado de los juegos; un bye cuenta como un empate y una penalización como una derrota. Las derrotas valen 0 y nunca restan."
        bonuses: "Bonus"
        bonuses_html: "Entrar en el top cut <b>+5</b>; llegar al top 4 del cut <b>+5 más</b>; ganar el torneo <b>+10 más</b>. Las ligas no tienen cut, así que no tienen bonus."
        factor: "Factor del evento"
        factor_lead: "Según el número de jugadores del evento (la lista de espera no cuenta):"
        field: "Jugadores"
        multiplier: "Factor"
        up_to: "%{count} o menos"
        between: "De %{from} a %{to}"
        more_than: "Más de %{count}"
        example_lead: "Ana juega un torneo de 40 jugadores: 4 victorias, 1 empate y 1 derrota en las suizas, y después gana el top cut."
        step: "Paso"
        rows:
          swiss: "Suizas: 4 × 3 + 1"
          cut: "Entró en el top cut"
          top4: "Llegó al top 4"
          won: "Ganó el torneo"
          subtotal: "Antes del factor del evento"
          total: "Puntos de Ana (40 jugadores, × 1,5)"
        rules: "Solo cuentan los eventos terminados. Una temporada es el año natural de la fecha de inicio del evento. El país y el equipo son los de la cuenta del jugador. La clasificación se recalcula cada noche y siempre que un evento termina o se corrige un resultado, así que una corrección en un evento pasado siempre queda reflejada."
      elo:
        note_html: "<b class=\"font-semibold text-ink\">Clasificación.</b> Un rating que sube cuando ganas a jugadores mejores que tú y apenas se mueve cuando ganas a jugadores muy por debajo. Todos empiezan con 1500."
        open: "¿Cómo se calcula el rating?"
        title: "Cómo se calcula el rating"
        short:
          - "Todo el mundo empieza con 1500 canicas."
          - "Cuando ganas una partida, te quedas con algunas canicas de los jugadores a los que ganaste. Cuando pierdes, das algunas."
          - "Si ganas a alguien con <b>muchas más</b> canicas que tú, te llevas <b>muchas</b>. Si ganas a alguien con muchas menos, te llevas <b>solo unas pocas</b>. Si pierdes contra alguien muy por debajo, das muchas."
          - "Un empate es un pequeño intercambio: quien tiene más canicas da unas pocas a quien tiene menos."
          - "En una mesa de cuatro juegas contra los otros tres a la vez, así que una victoria recoge canicas de los tres."
        d1_html: "La clasificación usa el <b>sistema de rating Elo</b>, creado por Arpad Elo para el ajedrez y usado desde entonces por la mayoría de los juegos competitivos. Cada jugador tiene un rating <code>R</code>. Antes de una partida, la diferencia de rating predice el resultado: la <b>puntuación esperada</b> del jugador A contra el jugador B es"
        d2_html: "Ratings iguales dan una puntuación esperada de 0,5 (cara o cruz). Una ventaja de 200 puntos da cerca de 0,76, una de 400 puntos cerca de 0,91. Después de la partida, la puntuación real <code>S</code> es 1 en una victoria, 0,5 en un empate y 0 en una derrota, y el rating cambia"
        d3_html: "con <code>K = 32</code>. Cuanto más se aleja el resultado de lo esperado, mayor es el cambio; un resultado exactamente como se esperaba no cambia nada."
        pods: "Mesas de cuatro"
        pods_text: "Una mesa de Commander cuenta como seis duelos, uno por cada pareja de jugadores de la mesa. El ganador suma 1 contra cada uno de los otros tres; esos tres suman 0 contra el ganador y 0,5 entre sí. Una mesa empatada son seis empates. Cada duelo actualiza a los dos jugadores con la fórmula de arriba, así que una victoria en una mesa llena de jugadores de 1700 vale mucho más que una victoria entre jugadores de 1400. Un jugador que abandona o no se presenta queda fuera en esa ronda. En los eventos 1v1 cada partida es un único duelo."
        example_lead: "Ana (1500) gana una mesa contra Bruno (1600), Carla (1500) y Diogo (1400)."
        duel: "Duelo"
        expected: "Esperado"
        actual: "Real"
        change: "Cambio de Ana"
        versus: "Ana vs %{name} (%{rating})"
        after: "Ana después de la mesa"
        example_note: "Bruno, Carla y Diogo pierden cada uno su lado del duelo con Ana e intercambian pequeñas cantidades entre ellos por los empates."
        rules: "Los jugadores nuevos empiezan con 1500 y se marcan como provisionales hasta 10 partidas con rating; solo cuentan los eventos terminados y las rondas del top cut no cuentan para el rating. El rating de una temporada cuenta los eventos de esa temporada y \"Histórico\" cuenta todos; los filtros solo eligen quién aparece, nunca cambian un rating. Los ratings se recalculan desde cero siempre que se corrige un resultado, así que una corrección en un evento pasado siempre queda reflejada."
      teams:
        note_html: "<b class=\"font-semibold text-ink\">Equipos.</b> Un equipo es el grupo de amigos que un jugador indica en su cuenta, no una inscripción en un torneo. Los puntos del equipo salen de lo que hacen sus jugadores: puntos de ranking, top cuts y victorias, contando a los cinco mejores jugadores del equipo."
        open: "¿Cómo se calculan los puntos de los equipos?"
        title: "Cómo se calculan los puntos de los equipos"
        short:
          - "Un equipo es un grupo de amigos que juegan juntos. El equipo no juega como equipo: cada amigo juega sus propios torneos."
          - "La puntuación del equipo es lo que sus amigos traen a casa: cada punto que un amigo gana en el ranking va al bote del equipo, un top cut añade un bonus y una victoria en un torneo añade un bonus mayor."
          - "Solo los cinco mejores amigos de cada equipo ponen puntos en el bote, así que un equipo enorme no puede ganar solo por tener muchos miembros."
        d1: "En los eventos que coinciden con los filtros, la contribución de cada jugador es"
        formula: "contribución = puntos de ranking + %{cut} × top cuts + %{win} × victorias"
        d2_html: "La puntuación del equipo es la suma de las <b>cinco mayores contribuciones</b> entre sus jugadores (todas, cuando el equipo tiene cinco o menos). La tabla también muestra los totales simples (eventos, victorias, top cuts) y el rating Elo medio de los jugadores contados, que no entra en la puntuación."
        ranking_points: "Puntos de ranking"
        contribution: "Contribución"
        total:
          one: "Equipo (1 jugador)"
          other: "Equipo (%{count} jugadores)"
        rules: "Un jugador cuenta para el equipo indicado en su cuenta cuando se recalcula la clasificación (cada noche y después de cada evento), así que cambiar de equipo lleva todos sus puntos al nuevo equipo. Los equipos de un solo jugador también aparecen. Los bonus (15 y 30) están en un solo sitio para poder cambiarlos sin tocar el resto."
