# Kamal 2 deploy for Grindin Station: one VPS runs the app (Puma + Solid Queue in Puma),
# kamal-proxy (Let's Encrypt) and the Postgres + PostGIS accessory.
# Host and domain come from ENV (GitHub secrets GS_VPS_HOST / GS_DOMAIN); the defaults are
# documentation placeholders (RFC 5737 / example.com) so `kamal config` parses without ENV.
# Secrets come from .kamal/secrets, which only reads ENV.
<% vps_host = ENV.fetch("GS_VPS_HOST", "203.0.113.10") %>
<% domain = ENV.fetch("GS_DOMAIN", "grindin.example.com") %>

service: grindin-station

# Kamal prefixes registry.server, so this resolves to ghcr.io/kakahpt/grindin-station.
image: kakahpt/grindin-station

servers:
  web:
    - <%= vps_host %>

# TLS via Let's Encrypt; the DNS A record for the domain must point at the VPS first.
proxy:
  ssl: true
  host: <%= domain %>
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

registry:
  server: ghcr.io
  username: kakahpt
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - PRIMARY_DATABASE_URL
    - CACHE_DATABASE_URL
    - QUEUE_DATABASE_URL
    - CABLE_DATABASE_URL
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - DISCORD_CLIENT_ID
    - DISCORD_CLIENT_SECRET
    - SMTP_ADDRESS
    - SMTP_PORT
    - SMTP_DOMAIN
    - SMTP_USER_NAME
    - SMTP_PASSWORD
  clear:
    # Run the Solid Queue supervisor inside Puma (single server).
    SOLID_QUEUE_IN_PUMA: true
    RAILS_LOG_LEVEL: info
    GS_DOMAIN: <%= domain %>

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# Active Storage files (avatars) live on this named volume.
volumes:
  - "grindin_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404s on in-flight requests.
asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: postgis/postgis:17-3.5
    host: <%= vps_host %>
    # Only reachable from the VPS itself (the app uses the kamal Docker network: grindin-station-db:5432).
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: grindin
        # init.sql creates the four application databases; keep the bootstrap database separate.
        POSTGRES_DB: postgres
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
    files:
      - config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
